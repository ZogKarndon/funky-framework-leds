; Framework 16 RGB LED Matrix (Joe Schroedl Rev 2) — PlatformIO
; Primary workflow: VS Code + PlatformIO extension
;
; Build:   pio run
; Upload:  put module in BOOTSEL (DIP 2 ON), then: pio run -t upload
; Monitor: pio device monitor

[env:fw16_rgb]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic
framework = arduino
board_build.core = earlephilhower

; Match stock Adalight / Arduino IDE settings for these modules:
; Boot Stage 2: W25Q16JVxQ QSPI /4
; Flash Size:   4MB (no FS)
; USB Stack:    Pico SDK (default for this core)
board_build.arduino.earlephilhower.boot2_source = boot2_w25q16jvxq_4_padded_checksum.S
board_build.filesystem_size = 0m
board_upload.maximum_size = 4194304

lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.0

monitor_speed = 115200
upload_protocol = picotool
